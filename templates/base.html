<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Decide Solutions — Free Online Tools{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.0">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Enterprise Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="{{ url_for('index') }}" class="brand-group">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <div class="brand-title">
          <span>Decide Solutions</span>
          <span class="brand-sub">Group of Solutions</span>
        </div>
      </a>

    </div>
  </nav>

  <!-- Main Content Body -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="nav-container" style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
      <p style="color: var(--text-secondary); font-weight: 500;">
        <strong>Decide Solutions</strong>
      </p>
      <p style="font-size: 0.85rem; color: var(--text-muted);">
        Fast, private, and simple tools for your files and media.
      </p>
    </div>
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
